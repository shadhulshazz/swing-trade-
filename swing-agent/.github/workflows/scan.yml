name: swing-scan

on:
  schedule:
    # Every 30 min, 3:30-10:15 UTC = 9:00-15:45 IST, Mon-Fri (NSE market hours + buffer)
    - cron: '*/30 3-10 * * 1-5'
  workflow_dispatch: {}   # allows manual "Run workflow" trigger from the Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        run: python scan.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
          TRADING_CAPITAL: ${{ vars.TRADING_CAPITAL }}
          RISK_PCT_PER_TRADE: ${{ vars.RISK_PCT_PER_TRADE }}
