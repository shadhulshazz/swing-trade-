name: telegram-bot

on:
  schedule:
    - cron: "*/5 * * * *"   # Every 5 minutes, 24/7
  workflow_dispatch:          # Allow manual test runs

jobs:
  poll:
    name: Poll Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 8

    env:
      TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
      GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
      TRADING_CAPITAL:     "40000"
      SCORE_THRESHOLD:     "5"
      MIN_RISK_REWARD:     "2.0"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll Telegram and process commands
        run: python bot_poll.py
