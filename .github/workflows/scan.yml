name: swing-scan

on:
  # ── Manual trigger (for testing) ─────────────────────────────────────────
  workflow_dispatch:

  # ── Auto-schedule: every 30 min during NSE hours (Mon–Fri) ───────────────
  # NSE hours: 09:00–15:45 IST  =  03:30–10:15 UTC
  # We fire at :00 and :30 of each UTC hour in that window.
  # Cron minute/hour fields are UTC.
  schedule:
    - cron: "0 3 * * 1-5"    # 09:00 IST
    - cron: "30 3 * * 1-5"   # 09:30 IST
    - cron: "0 4 * * 1-5"    # 09:30 IST
    - cron: "30 4 * * 1-5"   # 10:00 IST
    - cron: "0 5 * * 1-5"    # 10:30 IST
    - cron: "30 5 * * 1-5"   # 11:00 IST
    - cron: "0 6 * * 1-5"    # 11:30 IST
    - cron: "30 6 * * 1-5"   # 12:00 IST
    - cron: "0 7 * * 1-5"    # 12:30 IST
    - cron: "30 7 * * 1-5"   # 13:00 IST
    - cron: "0 8 * * 1-5"    # 13:30 IST
    - cron: "30 8 * * 1-5"   # 14:00 IST
    - cron: "0 9 * * 1-5"    # 14:30 IST
    - cron: "30 9 * * 1-5"   # 15:00 IST
    - cron: "0 10 * * 1-5"   # 15:30 IST
    - cron: "15 10 * * 1-5"  # 15:45 IST (final scan)

jobs:
  scan:
    name: NSE Swing Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Secrets (never appear in logs)
      TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
      GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
      # Variables (visible in logs — not sensitive)
      TRADING_CAPITAL:     ${{ vars.TRADING_CAPITAL }}
      RISK_PCT_PER_TRADE:  ${{ vars.RISK_PCT_PER_TRADE }}
      # Hard-coded defaults (override in the Variables tab if needed)
      SCORE_THRESHOLD:     "5"
      MIN_RISK_REWARD:     "2.0"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run swing scan
        run: python scan.py

      - name: Upload run log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scan-failure-log
          path: "*.log"
          if-no-files-found: ignore
