name: swing-scan

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: 'Specific ticker to scan (e.g. ITC)'
        required: false
        type: string

jobs:
  scan:
    name: NSE Swing Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
      GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
      SCORE_THRESHOLD:     "5"
      MIN_RISK_REWARD:     "2.0"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run swing scan
        run: |
          if [ -n "${{ github.event.inputs.ticker }}" ]; then
            python scan.py --ticker "${{ github.event.inputs.ticker }}"
          else
            python scan.py
          fi

      - name: Upload run log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scan-failure-log
          path: "*.log"
          if-no-files-found: ignore
