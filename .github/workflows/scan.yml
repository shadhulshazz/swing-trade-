name: swing-scan

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1-5"
    - cron: "30 3 * * 1-5"
    - cron: "0 4 * * 1-5"
    - cron: "30 4 * * 1-5"
    - cron: "0 5 * * 1-5"
    - cron: "30 5 * * 1-5"
    - cron: "0 6 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "30 7 * * 1-5"
    - cron: "0 8 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "0 9 * * 1-5"
    - cron: "30 9 * * 1-5"
    - cron: "0 10 * * 1-5"
    - cron: "15 10 * * 1-5"

jobs:
  scan:
    name: NSE Swing Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
      GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
      TRADING_CAPITAL:     ${{ vars.TRADING_CAPITAL }}
      RISK_PCT_PER_TRADE:  ${{ vars.RISK_PCT_PER_TRADE }}
      SCORE_THRESHOLD:     "5"
      MIN_RISK_REWARD:     "2.0"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run swing scan
        run: python scan.py

      - name: Upload run log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scan-failure-log
          path: "*.log"
          if-no-files-found: ignore
